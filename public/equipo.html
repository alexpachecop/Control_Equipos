<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b3d">
<title>Equipo</title>
<style>
:root{
  --blue:#2563eb;--dark:#0f1b3d;--bg:#f0f4f8;--white:#fff;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --radius:16px;--shadow:0 2px 12px rgba(0,0,0,.08);--action-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding-bottom:calc(var(--action-h) + env(safe-area-inset-bottom,16px));
}

/* Hero */
.hero{background:linear-gradient(150deg,var(--dark) 0%,#1a3a8f 100%);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 26px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 50%,rgba(37,99,235,.4) 0%,transparent 60%);pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1}
.hero-taller{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px}
.hero-emoji{font-size:2rem;margin-bottom:8px}
.hero-nombre{font-size:1.4rem;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px}
.hero-tipo{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);padding:3px 10px;border-radius:999px}
.hero-cliente{margin-top:10px;font-size:.83rem;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel-link{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);border-radius:999px;font-size:.78rem;font-weight:600;text-decoration:none;margin-top:2px}

/* Skeleton */
.skel{background:#e2e8f0;border-radius:8px;animation:skel 1.4s ease-in-out infinite}
@keyframes skel{0%,100%{opacity:1}50%{opacity:.5}}

/* Ticket banner */
.tk-banner{margin:14px 14px 0;background:var(--white);border-radius:14px;padding:13px 15px;border-left:4px solid var(--tc,#94a3b8);box-shadow:var(--shadow)}
.tk-active-label{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tc);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tk-banner-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.tk-num{font-family:ui-monospace,monospace;font-size:.78rem;font-weight:700;color:var(--blue)}
.tk-pill{font-size:.68rem;font-weight:800;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tct,var(--tc));border:1px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.tk-desc{font-size:.82rem;line-height:1.4;margin-bottom:5px}
.tk-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.75rem;color:var(--muted)}
.tk-edit-btn{margin-top:10px;width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--tc,var(--border));background:color-mix(in srgb,var(--tc,transparent) 8%,#fff);color:var(--tc,var(--blue));font-size:.82rem;font-weight:700;cursor:pointer;text-align:center}

/* Info chips */
.chips-wrap{margin:14px 14px 0;background:var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1px}
.info-chip{background:var(--white);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ic-label{font-size:.73rem;font-weight:600;color:var(--muted)}
.ic-val{font-size:.83rem;font-weight:600;text-align:right}
.ic-color{color:var(--cc,var(--text))}

/* Notas */
.notas-box{margin:12px 14px 0;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:.82rem;color:#78350f;line-height:1.5}

/* Section header */
.sh{display:flex;align-items:center;gap:8px;margin:20px 14px 10px}
.sh-txt{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.sh-line{flex:1;height:1px;background:var(--border)}
.sh-btn{background:none;border:1.5px solid var(--blue);border-radius:8px;color:var(--blue);font-size:.72rem;font-weight:700;padding:3px 10px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.sh-btn:active{opacity:.7}

/* Fotos gallery */
.gallery{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none;-ms-overflow-style:none}
.gallery::-webkit-scrollbar{display:none}
.gallery-img{width:96px;height:96px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:zoom-in;border:1px solid var(--border)}
.gallery-empty{padding:0 14px;font-size:.82rem;color:var(--muted);font-style:italic}

/* Timeline */
.timeline{margin:0 14px;display:flex;flex-direction:column}
.tl-item{display:flex;gap:10px;padding-bottom:14px}
.tl-item.last{padding-bottom:0}
.tl-line{display:flex;flex-direction:column;align-items:center;width:16px;flex-shrink:0;padding-top:3px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px var(--bg)}
.tl-line::after{content:'';flex:1;width:2px;background:var(--border);margin-top:4px}
.tl-item.last .tl-line::after{display:none}
.tl-body{flex:1;min-width:0;background:var(--white);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tl-fecha{font-size:.71rem;color:var(--muted)}
.tl-tipo{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px}
.tl-prob{font-size:.78rem;color:#b45309;background:#fef3c7;border-radius:6px;padding:3px 7px;margin-bottom:3px;line-height:1.4}
.tl-work{font-size:.82rem;line-height:1.45}
.tl-tec{font-size:.72rem;color:var(--muted);margin-top:3px}
.tl-empty{padding:0 14px;font-size:.82rem;color:var(--muted);font-style:italic}

/* Componentes */
.comp-grid{margin:0 14px;display:flex;flex-direction:column;gap:7px}
.comp-chip{background:var(--white);border-radius:11px;padding:9px 13px;box-shadow:var(--shadow)}
.comp-chip-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.comp-info{flex:1;min-width:0}
.comp-tipo{font-size:.83rem;font-weight:600}
.comp-desc{font-weight:400;color:var(--muted)}
.comp-sn{font-size:.7rem;color:var(--muted);margin-top:2px;font-family:ui-monospace,monospace}
.comp-date{font-size:.66rem;color:var(--muted);margin-top:3px;opacity:.7}
.comp-edit-btns{display:flex;gap:5px;flex-shrink:0;margin-top:1px}
.comp-btn{background:none;border:1.5px solid var(--border);border-radius:7px;color:var(--muted);font-size:.72rem;padding:3px 8px;cursor:pointer;line-height:1.4}
.comp-btn:active{opacity:.6}
.comp-btn.del{border-color:#fca5a5;color:#dc2626}

/* Login banner */
.login-banner{margin:14px 14px 0;background:var(--white);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
.login-banner-txt{font-size:.82rem;color:var(--muted)}
.login-banner-btn{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}

/* Fixed bottom action bar */
.action-bar{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--action-h);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--white);border-top:1px solid var(--border);
  display:flex;gap:8px;z-index:40;box-shadow:0 -4px 24px rgba(0,0,0,.08);
}
.action-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;border-radius:12px;background:var(--bg);cursor:pointer;
  font-size:.68rem;font-weight:700;color:var(--muted);transition:background .12s,color .12s;padding:6px 4px;
}
.action-btn svg{width:20px;height:20px;flex-shrink:0}
.action-btn:active{opacity:.7}
.action-btn.ab-primary{background:var(--blue);color:#fff}
.action-btn.ab-warn{background:#f59e0b;color:#fff}
.action-btn.ab-auth{background:#6366f1;color:#fff}

/* Sheet overlay */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.visible{opacity:1;pointer-events:auto}

/* Bottom sheet */
.sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-radius:24px 24px 0 0;z-index:60;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);
  max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px);
}
.sheet.open{transform:translateY(0);transition-timing-function:cubic-bezier(.22,1,.36,1)}
.sheet-handle{width:40px;height:4px;background:#e2e8f0;border-radius:99px;margin:12px auto 0}
.sheet-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.sheet-header h3{font-size:1rem;font-weight:700;margin:0}
.sheet-close{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;padding:4px 8px;line-height:1}
.sheet-body{padding:14px 18px 20px;display:flex;flex-direction:column;gap:11px}
.sf{display:flex;flex-direction:column;gap:5px}
.sf label{font-size:.76rem;font-weight:600;color:var(--muted)}
.sf input,.sf select,.sf textarea{
  padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.9rem;font-family:inherit;color:var(--text);background:#f8fafc;
  -webkit-appearance:none;appearance:none;outline:none;
}
.sf input:focus,.sf select:focus,.sf textarea:focus{border-color:var(--blue);background:#fff}
.sf textarea{resize:vertical;min-height:70px}
.sf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-submit{
  padding:14px;border:none;border-radius:12px;
  background:var(--blue);color:#fff;font-size:.92rem;font-weight:700;
  cursor:pointer;width:100%;margin-top:4px;
}
.sheet-submit:active{opacity:.85}
.sheet-submit:disabled{opacity:.5;cursor:not-allowed}

/* File picker */
.foto-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.foto-pick-btn{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:18px 10px;border:2px dashed var(--border);border-radius:12px;
  cursor:pointer;color:var(--muted);font-size:.82rem;font-weight:600;background:#f8fafc;
  text-align:center;
}
.foto-pick-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.foto-pick-btn-icon{font-size:1.5rem}
.foto-pick-btn:active{background:#f0f4ff}
.file-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.file-preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}

/* Photo viewer */
.photo-viewer{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.photo-viewer.visible{opacity:1;pointer-events:auto}
.photo-viewer img{max-width:100%;max-height:100%;object-fit:contain}
.pv-close{position:absolute;top:calc(env(safe-area-inset-top,16px) + 8px);right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

/* Toast */
.toast{position:fixed;bottom:calc(var(--action-h) + 12px);left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:.82rem;font-weight:600;z-index:200;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .3s}

/* Tall sheet (flex column) */
.sheet-tall{display:flex;flex-direction:column;max-height:92vh}
.sheet-tall .sheet-scroll{flex:1;overflow-y:auto;min-height:0}

/* Ticket viewer in sheet */
.tkv-head{padding:12px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.tkv-num{font-family:ui-monospace,monospace;font-size:.88rem;font-weight:700;color:var(--blue)}
.tkv-pill{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.tkv-meta{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.5}

/* Ticket timeline */
.tkv-tl{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.tkv-loading{padding:24px 18px;text-align:center;font-size:.84rem;color:var(--muted)}
.tkv-ev{display:flex;gap:10px;align-items:flex-start}
.tkv-ev-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex-shrink:0;color:#fff;letter-spacing:0}
.tkv-ev-body{flex:1;min-width:0}
.tkv-ev-title{font-size:.84rem;color:var(--text);margin-bottom:2px;line-height:1.35}
.tkv-ev-note{font-size:.84rem;background:#fef3c7;color:#78350f;border-radius:8px;padding:7px 10px;line-height:1.4;word-break:break-word}
.tkv-ev-who{font-size:.7rem;color:var(--muted);margin-top:3px}

/* Ticket sheet footer bars */
.tkv-nota-bar{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.tkv-nota-bar input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.88rem;font-family:inherit;background:#f8fafc;color:var(--text);outline:none;-webkit-appearance:none}
.tkv-nota-bar input:focus{border-color:var(--blue);background:#fff}
.tkv-estado-bar{padding:10px 14px 6px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0}
.tkv-estado-bar select{flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;background:#f8fafc;color:var(--text);-webkit-appearance:none;outline:none;font-family:inherit}
.tkv-comment-bar{padding:0 14px 10px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.tkv-comment-bar input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;font-family:inherit;background:#f8fafc;color:var(--text);outline:none;-webkit-appearance:none}
.tkv-comment-bar input:focus{border-color:var(--blue);background:#fff}
.tkv-footer-btns{padding:8px 14px 2px;display:flex;gap:8px;flex-shrink:0}
.tkv-btn{flex:1;padding:11px;border:none;border-radius:11px;font-size:.84rem;font-weight:700;cursor:pointer}
.tkv-btn-edit{background:#f1f5f9;color:var(--text)}
.tkv-btn-notif{background:#e0f2fe;color:#0369a1}

/* Footer */
.footer{padding:18px 14px;text-align:center;font-size:.7rem;color:var(--muted)}

/* Error page */
.error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:12px;padding:24px;text-align:center;color:var(--muted)}
.error-page h2{color:var(--text);font-size:1.1rem}
</style>
</head>
<body>

<!-- Hero (populated by JS) -->
<div class="hero" id="hero">
  <img src="/logo.png" style="height:20px;width:auto;object-fit:contain;filter:brightness(0)invert(1);opacity:.55;margin-bottom:6px;display:block" alt="Logo">
  <div class="hero-taller" id="h-taller">&nbsp;</div>
  <div class="hero-emoji" id="h-emoji"><div class="skel" style="width:36px;height:36px;border-radius:8px"></div></div>
  <div class="hero-nombre" id="h-nombre"><div class="skel" style="width:180px;height:22px"></div></div>
  <span class="hero-tipo" id="h-tipo" style="opacity:0">…</span>
  <div id="h-cliente"></div>
</div>

<!-- Dynamic sections -->
<div id="s-ticket"></div>
<div id="s-login"></div>
<div id="s-chips"></div>
<div id="s-notas"></div>
<div id="s-fotos"></div>
<div id="s-hist"></div>
<div id="s-comp"></div>
<div class="footer" id="s-footer">&nbsp;</div>

<!-- Action bar -->
<div class="action-bar" id="action-bar">
  <button class="action-btn ab-primary" id="btn-intervencion" onclick="requireAuth(function(){ openSheet('intervencion'); })">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    Intervención
  </button>
  <button class="action-btn" id="btn-fotos-bar" onclick="requireAuth(function(){ openSheet('fotos'); })">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>
    Fotos
  </button>
  <button class="action-btn" id="btn-tk" onclick="requireAuth(function(){ openSheet('ticket'); })">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2m0 10v2M13 11v2"/></svg>
    <span id="tk-btn-label">Ticket</span>
  </button>
</div>

<!-- Overlay -->
<div id="overlay" class="sheet-overlay" onclick="closeSheet()"></div>

<!-- Sheet: Nueva intervención -->
<div id="sheet-intervencion" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>Nueva intervención</h3><button class="sheet-close" onclick="closeSheet()">×</button></div>
  <div class="sheet-body">
    <div class="sf"><label>Fecha *</label><input id="h-fecha" type="date" required></div>
    <div class="sf"><label>Tipo *</label><select id="h-tipo-sel" required></select></div>
    <div class="sf"><label>Problema reportado</label><textarea id="h-problema" placeholder="Síntomas que describe el cliente…"></textarea></div>
    <div class="sf"><label>Trabajo realizado *</label><textarea id="h-trabajo" required placeholder="Descripción detallada…" style="min-height:90px"></textarea></div>
    <div class="sf-row">
      <div class="sf"><label>Técnico</label><select id="h-tecnico"></select></div>
      <div class="sf"><label>Coste (€)</label><input id="h-coste" type="number" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <div class="sf"><label>Próxima revisión</label><input id="h-revision" type="date"></div>
    <button class="sheet-submit" id="btn-submit-hist" onclick="submitHistorial()">Guardar intervención</button>
  </div>
</div>

<!-- Sheet: Fotos -->
<div id="sheet-fotos" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>Añadir fotos</h3><button class="sheet-close" onclick="closeSheet()">×</button></div>
  <div class="sheet-body">
    <div class="foto-btn-row">
      <label class="foto-pick-btn">
        <input type="file" id="foto-camara" accept="image/*" capture="environment" onchange="onFotoSelect(this)">
        <span class="foto-pick-btn-icon">📷</span>
        <span>Cámara</span>
      </label>
      <label class="foto-pick-btn">
        <input type="file" id="foto-galeria" accept="image/*" multiple onchange="onFotoSelect(this)">
        <span class="foto-pick-btn-icon">🖼️</span>
        <span>Galería</span>
      </label>
    </div>
    <div class="file-preview" id="file-preview"></div>
    <button class="sheet-submit" id="btn-upload-foto" onclick="submitFotos()" disabled>Subir fotos</button>
  </div>
</div>

<!-- Sheet: Ticket viewer -->
<div id="sheet-ticket" class="sheet sheet-tall">
  <div class="sheet-handle"></div>
  <div class="sheet-header" style="flex-shrink:0">
    <h3 id="tk-sheet-title">Ticket</h3>
    <button class="sheet-close" onclick="closeSheet()">×</button>
  </div>
  <!-- Ticket viewer (active ticket) -->
  <div id="tkv-wrap" style="display:none;flex:1;flex-direction:column;min-height:0;display:flex">
    <div id="tkv-head" class="tkv-head">
      <div><span id="tkv-num" class="tkv-num"></span><span id="tkv-pill" class="tkv-pill"></span></div>
      <div id="tkv-meta" class="tkv-meta"></div>
    </div>
    <div class="sheet-scroll">
      <div id="tkv-tl" class="tkv-tl"><div class="tkv-loading">Cargando actividad…</div></div>
    </div>
    <div class="tkv-nota-bar" id="tkv-nota-bar" style="display:none">
      <input id="tkv-nota-input" type="text" placeholder="Añadir nota…">
      <button class="action-btn ab-primary" style="flex:0 0 auto;width:60px;height:40px;border-radius:10px;font-size:.78rem" onclick="submitTkNota()">Añadir</button>
    </div>
    <div class="tkv-estado-bar" id="tkv-estado-bar" style="display:none">
      <select id="tkv-estado-sel"></select>
    </div>
    <div class="tkv-comment-bar" id="tkv-comment-bar" style="display:none">
      <input id="tkv-estado-comentario" type="text" placeholder="Comentario al cambio (opcional)…">
      <button class="action-btn ab-primary" style="flex:0 0 auto;width:70px;height:40px;border-radius:10px;font-size:.78rem" onclick="submitTkEstado()">Aplicar</button>
    </div>
    <div class="tkv-footer-btns" id="tkv-footer-btns" style="display:none;padding-bottom:10px">
      <button class="tkv-btn tkv-btn-notif" onclick="submitTkNotificar()">✉️ Notificar</button>
      <button class="tkv-btn tkv-btn-edit" onclick="openTkEditSheet()">✏️ Editar detalles</button>
    </div>
  </div>
  <!-- Create ticket form (no active ticket) -->
  <div id="tkv-create" class="sheet-body" style="display:none"></div>
</div>

<!-- Sheet: Ticket edit (full form) -->
<div id="sheet-ticket-edit" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3>Editar ticket</h3><button class="sheet-close" onclick="closeSheet()">×</button></div>
  <div class="sheet-body" id="tk-edit-body"></div>
</div>

<!-- Sheet: Componente (añadir / editar) -->
<div id="sheet-comp" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header"><h3 id="comp-sheet-title">Componente</h3><button class="sheet-close" onclick="closeSheet()">×</button></div>
  <div class="sheet-body">
    <div class="sf"><label>Tipo *</label><input id="comp-tipo" type="text" placeholder="Ej: RAM, SSD, Pantalla…"></div>
    <div class="sf"><label>Descripción</label><input id="comp-desc-inp" type="text" placeholder="Ej: 8 GB DDR4 3200 MHz"></div>
    <div class="sf"><label>Número de serie</label><input id="comp-sn-inp" type="text" placeholder="Opcional"></div>
    <button class="sheet-submit" id="btn-comp-guardar" onclick="submitComp()">Guardar</button>
  </div>
</div>

<!-- Photo viewer -->
<div class="photo-viewer" id="photo-viewer" onclick="closePhoto()">
  <img id="pv-img" src="" alt="">
  <button class="pv-close" onclick="closePhoto()">×</button>
</div>

<script>
(function() {
  var parts = location.pathname.split('/');
  var EQ_ID = parts[parts.length - 1];
  if (!EQ_ID || isNaN(Number(EQ_ID))) {
    document.body.innerHTML = '<div class="error-page"><h2>URL inválida</h2><p>No se encontró el ID del equipo.</p></div>';
    return;
  }

  var state = { eq: null, cfg: null, tipos: [], tecnicos: [], estadosTk: [], authed: false, usuario: null };
  var currentSheet = null;
  var _editCompId = null;
  var _selectedFiles = [];
  var _compsById = {};

  var TIPO_EMOJI = { 'PC':'🖥️', 'Portátil':'💻', 'Tablet':'📱', 'TPV':'🖨️', 'Periférico':'🖱️' };
  var COLOR_TIPO = {
    'Reparación':'#ef4444','Sustitución de componente':'#f97316','Mantenimiento preventivo':'#22c55e',
    'Actualización de software':'#3b82f6','Limpieza':'#06b6d4','Diagnóstico':'#a855f7',
    'Configuración':'#6366f1','Entrega':'#10b981'
  };

  function ge(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtF(d) {
    if (!d) return '—';
    var p = d.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function fmtDT(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var pad = function(n) { return String(n).padStart(2,'0'); };
    return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear()
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ---- API ----
  async function api(url, opts) {
    var noRedirect = opts && opts.noRedirect;
    opts = Object.assign({ credentials: 'include' }, opts || {});
    delete opts.noRedirect;
    try {
      var r = await fetch(url, opts);
      if (r.status === 401) {
        if (!noRedirect) location.href = '/?qr_equipo=' + EQ_ID;
        return null;
      }
      if (r.status === 204) return {};
      var data = await r.json();
      if (!r.ok) { toast((data && data.error) || 'Error', true); return null; }
      return data;
    } catch (err) {
      toast('Error de red', true);
      return null;
    }
  }

  // ---- Toast ----
  function toast(msg, isErr) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.style.background = isErr ? '#dc2626' : '#16a34a';
    t.style.color = '#fff';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 2600);
  }

  // ---- requireAuth ----
  window.requireAuth = function(fn) {
    if (state.authed) { fn(); return; }
    toast('Inicia sesión para realizar esta acción', true);
    setTimeout(function() { location.href = '/?qr_equipo=' + EQ_ID; }, 1200);
  };

  // ---- Load ----
  async function load() {
    var results = await Promise.all([
      fetch('/api/equipos/' + EQ_ID, { credentials: 'include' }).then(function(r) { return r.ok ? r.json() : null; }),
      fetch('/api/config', { credentials: 'include' }).then(function(r) { return r.ok ? r.json() : null; }),
      fetch('/api/me', { credentials: 'include' }).then(function(r) { return r.ok ? r.json() : null; })
    ]);
    var eq = results[0], cfg = results[1], me = results[2];

    if (!eq) {
      document.body.innerHTML = '<div class="error-page"><h2>Equipo no encontrado</h2><p>Verifica la URL del QR.</p></div>';
      return;
    }

    state.eq = eq;
    state.cfg = cfg || {};
    state.authed = !!me;
    state.usuario = me || null;

    if (cfg) {
      try { state.tipos = JSON.parse(cfg.tipos_intervencion || '[]'); } catch(e) { state.tipos = []; }
      try { state.tecnicos = JSON.parse(cfg.tecnicos || '[]'); } catch(e) { state.tecnicos = []; }
      try { state.estadosTk = JSON.parse(cfg.estados_ticket || '[]'); } catch(e) { state.estadosTk = []; }
    }
    if (!state.estadosTk.length) state.estadosTk = [
      {nombre:'Pendiente',color:'#94a3b8'},{nombre:'Diagnóstico',color:'#3b82f6'},
      {nombre:'En reparación',color:'#f59e0b'},{nombre:'Esperando piezas',color:'#a855f7'},
      {nombre:'Listo',color:'#22c55e'},{nombre:'Entregado',color:'#10b981'},{nombre:'Cerrado',color:'#64748b'}
    ];
    if (!state.tipos.length) state.tipos = ['Reparación','Mantenimiento preventivo','Diagnóstico','Configuración','Limpieza','Entrega'];

    render();
  }

  async function reload() {
    var r = await fetch('/api/equipos/' + EQ_ID, { credentials: 'include' });
    if (!r.ok) return;
    state.eq = await r.json();
    render();
  }

  // ---- Render ----
  function tkColor(estado) {
    var found = state.estadosTk.find(function(s) { return s.nombre === estado; });
    return found ? found.color : '#94a3b8';
  }
  function pillTextColor(hex) {
    var c = hex || '#94a3b8';
    var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    if (lum <= 0.6) return c;
    return '#'+[r,g,b].map(function(x){return Math.round(x*0.5).toString(16).padStart(2,'0')}).join('');
  }

  function render() {
    var eq = state.eq;
    var taller = (state.cfg && state.cfg.nombre_taller) || 'Control de Equipos';

    ge('h-taller').textContent = taller;
    ge('h-emoji').textContent = TIPO_EMOJI[eq.tipo] || '🔧';
    ge('h-nombre').textContent = eq.nombre;
    ge('h-tipo').textContent = eq.tipo || '';
    ge('h-tipo').style.opacity = '1';
    var clienteHtml = '';
    if (eq.cliente_nombre) {
      clienteHtml = '<div class="hero-cliente"><span style="opacity:.5">Cliente</span> <strong style="color:#fff">' + esc(eq.cliente_nombre) + '</strong>';
      if (eq.cliente_tel) clienteHtml += '<a href="tel:' + esc(eq.cliente_tel) + '" class="tel-link">📞 ' + esc(eq.cliente_tel) + '</a>';
      clienteHtml += '</div>';
    }
    ge('h-cliente').innerHTML = clienteHtml;
    ge('s-footer').textContent = taller;
    document.title = eq.nombre;

    renderTicket(eq);
    renderLoginBanner();

    var garantiaTxt = null;
    if (eq.fecha_entrega && eq.meses_garantia) {
      var p = eq.fecha_entrega.split('-').map(Number);
      var fin = new Date(p[0], p[1] - 1 + Number(eq.meses_garantia), p[2]);
      var hoy = new Date(); hoy.setHours(0,0,0,0);
      garantiaTxt = fin >= hoy
        ? { txt: 'En garantía hasta ' + fin.toLocaleDateString('es-ES'), ok: true }
        : { txt: 'Garantía caducada (' + fin.toLocaleDateString('es-ES') + ')', ok: false };
    }
    var chips = [
      eq.numero_serie ? '<div class="info-chip"><span class="ic-label">N/S</span><span class="ic-val">' + esc(eq.numero_serie) + '</span></div>' : '',
      eq.fecha_entrega ? '<div class="info-chip"><span class="ic-label">Recepción</span><span class="ic-val">' + fmtF(eq.fecha_entrega) + '</span></div>' : '',
      garantiaTxt ? '<div class="info-chip" style="--cc:' + (garantiaTxt.ok ? '#16a34a' : '#dc2626') + '"><span class="ic-label">Garantía</span><span class="ic-val ic-color">' + esc(garantiaTxt.txt) + '</span></div>' : '',
      eq.mantenimiento ? '<div class="info-chip" style="--cc:#16a34a"><span class="ic-label">Mantenimiento</span><span class="ic-val ic-color">Activo</span></div>' : '',
      eq.bateria_vida_pct != null ? '<div class="info-chip"><span class="ic-label">Batería</span><span class="ic-val">' + eq.bateria_vida_pct + '%' + (eq.bateria_cap_actual != null ? ' · ' + eq.bateria_cap_actual + ' mWh' : '') + '</span></div>' : '',
    ].filter(Boolean).join('');
    ge('s-chips').innerHTML = chips ? '<div class="chips-wrap">' + chips + '</div>' : '';

    ge('s-notas').innerHTML = eq.notas ? '<div class="notas-box">💬 ' + esc(eq.notas) + '</div>' : '';

    renderFotos(eq.fotos || []);
    renderHistorial(eq.historial || []);
    renderComponentes(eq.componentes || []);

    var tk = eq.ticket_activo;
    var btn = ge('btn-tk');
    var lbl = ge('tk-btn-label');
    if (tk) { btn.className = 'action-btn ab-warn'; lbl.textContent = 'Ticket activo'; }
    else { btn.className = 'action-btn'; lbl.textContent = '+ Ticket'; }
  }

  function renderLoginBanner() {
    if (state.authed) { ge('s-login').innerHTML = ''; return; }
    ge('s-login').innerHTML =
      '<div class="login-banner">' +
        '<span class="login-banner-txt">Inicia sesión para editar este equipo</span>' +
        '<a href="/?qr_equipo=' + EQ_ID + '" class="login-banner-btn">Iniciar sesión</a>' +
      '</div>';
  }

  function renderTicket(eq) {
    var tk = eq.ticket_activo;
    if (!tk) { ge('s-ticket').innerHTML = ''; return; }
    var col = tkColor(tk.estado);
    ge('s-ticket').innerHTML =
      '<div class="tk-banner" style="--tc:' + col + ';--tct:' + pillTextColor(col) + '">' +
        '<div class="tk-active-label"><span class="pulse-dot"></span>Ticket activo</div>' +
        '<div class="tk-banner-top"><span class="tk-num">' + esc(tk.numero) + '</span><span class="tk-pill">' + esc(tk.estado) + '</span></div>' +
        (tk.descripcion ? '<div class="tk-desc">' + esc(tk.descripcion) + '</div>' : '') +
        '<div class="tk-meta">' +
          (tk.tecnico_asignado ? '<span>👤 ' + esc(tk.tecnico_asignado) + '</span>' : '') +
          (tk.fecha_estimada ? '<span>📅 Estimado: ' + fmtF(tk.fecha_estimada) + '</span>' : '') +
          (tk.coste != null ? '<span>💶 ' + Number(tk.coste).toFixed(2) + ' €</span>' : '') +
        '</div>' +
        '<button class="tk-edit-btn" onclick="openSheet(\'ticket\')">' + (state.authed ? '✏️ Actualizar estado / ver actividad' : '🔍 Ver actividad del ticket') + '</button>' +
      '</div>';
  }

  function renderFotos(fotos) {
    if (!fotos.length) {
      ge('s-fotos').innerHTML = '<div class="sh"><span class="sh-txt">Fotos</span><div class="sh-line"></div></div><p class="gallery-empty">Sin fotos del equipo</p>';
      return;
    }
    var imgs = fotos.map(function(f) {
      return '<img class="gallery-img" src="/uploads/' + esc(f.archivo) + '" loading="lazy" onclick="openPhoto(\'/uploads/' + esc(f.archivo) + '\')">';
    }).join('');
    ge('s-fotos').innerHTML = '<div class="sh"><span class="sh-txt">Fotos (' + fotos.length + ')</span><div class="sh-line"></div></div><div class="gallery">' + imgs + '</div>';
  }

  function renderHistorial(hist) {
    if (!hist.length) {
      ge('s-hist').innerHTML = '<div class="sh"><span class="sh-txt">Historial</span><div class="sh-line"></div></div><p class="tl-empty">Sin intervenciones registradas</p>';
      return;
    }
    var items = hist.map(function(h, i) {
      var col = COLOR_TIPO[h.tipo] || '#94a3b8';
      return '<div class="tl-item' + (i === hist.length - 1 ? ' last' : '') + '">' +
        '<div class="tl-line"><div class="tl-dot" style="background:' + col + '"></div></div>' +
        '<div class="tl-body">' +
          '<div class="tl-meta"><span class="tl-fecha">' + fmtF(h.fecha) + '</span><span class="tl-tipo" style="color:' + col + ';background:' + col + '18">' + esc(h.tipo) + '</span></div>' +
          (h.problema_reportado ? '<div class="tl-prob">' + esc(h.problema_reportado) + '</div>' : '') +
          '<div class="tl-work">' + esc(h.descripcion) + '</div>' +
          (h.tecnico ? '<div class="tl-tec">👤 ' + esc(h.tecnico) + '</div>' : '') +
        '</div></div>';
    }).join('');
    ge('s-hist').innerHTML = '<div class="sh"><span class="sh-txt">Historial (' + hist.length + ')</span><div class="sh-line"></div></div><div class="timeline">' + items + '</div>';
  }

  function renderComponentes(comps) {
    _compsById = {};
    comps.forEach(function(c) { _compsById[c.id] = c; });

    var shBtn = state.authed
      ? '<button class="sh-btn" onclick="openCompSheet(null)">+ Componente</button>'
      : '';
    var header = '<div class="sh"><span class="sh-txt">Componentes' + (comps.length ? ' (' + comps.length + ')' : '') + '</span><div class="sh-line"></div>' + shBtn + '</div>';

    if (!comps.length) {
      ge('s-comp').innerHTML = state.authed
        ? header + '<p class="tl-empty" style="padding:0 14px">Sin componentes. <button onclick="openCompSheet(null)" style="background:none;border:none;color:var(--blue);font-weight:600;cursor:pointer;font-size:.82rem">Añadir uno</button></p>'
        : '';
      return;
    }

    var chips = comps.map(function(c) {
      var editBtns = state.authed
        ? '<div class="comp-edit-btns">' +
            '<button class="comp-btn" onclick="openCompById(' + c.id + ')">✎</button>' +
            '<button class="comp-btn del" onclick="deleteComp(' + c.id + ')">✕</button>' +
          '</div>'
        : '';
      var dateStr = c.creado_en ? '<div class="comp-date">Añadido ' + fmtDT(c.creado_en) + '</div>' : '';
      return '<div class="comp-chip">' +
        '<div class="comp-chip-inner">' +
          '<div class="comp-info">' +
            '<div class="comp-tipo">' + esc(c.tipo) + (c.descripcion ? '<span class="comp-desc"> · ' + esc(c.descripcion) + '</span>' : '') + '</div>' +
            (c.numero_serie ? '<div class="comp-sn">S/N ' + esc(c.numero_serie) + '</div>' : '') +
            dateStr +
          '</div>' +
          editBtns +
        '</div>' +
      '</div>';
    }).join('');

    ge('s-comp').innerHTML = header + '<div class="comp-grid">' + chips + '</div>';
  }

  // ---- Sheets ----
  window.openSheet = function(name) {
    if (currentSheet) closeSheet();
    var sheet = ge('sheet-' + name);
    if (!sheet) return;
    if (name === 'intervencion') populateIntervForm();
    if (name === 'ticket') populateTicketSheet();
    if (name === 'fotos') resetFotos();
    currentSheet = sheet;
    ge('overlay').classList.add('visible');
    requestAnimationFrame(function() { sheet.classList.add('open'); });
  };

  window.closeSheet = function() {
    if (!currentSheet) return;
    currentSheet.classList.remove('open');
    ge('overlay').classList.remove('visible');
    currentSheet = null;
  };

  // ---- Intervención ----
  function populateIntervForm() {
    ge('h-fecha').value = new Date().toISOString().split('T')[0];
    ge('h-problema').value = '';
    ge('h-trabajo').value = '';
    ge('h-coste').value = '';
    ge('h-revision').value = '';
    var tipoSel = ge('h-tipo-sel');
    tipoSel.innerHTML = state.tipos.map(function(t) { return '<option>' + esc(t) + '</option>'; }).join('');
    var tecSel = ge('h-tecnico');
    tecSel.innerHTML = '<option value="">— Sin asignar —</option>' + state.tecnicos.map(function(t) { return '<option>' + esc(t) + '</option>'; }).join('');
    if (state.usuario && state.usuario.nombre) {
      for (var i = 0; i < tecSel.options.length; i++) {
        if (tecSel.options[i].value === state.usuario.nombre || tecSel.options[i].text === state.usuario.nombre) {
          tecSel.selectedIndex = i; break;
        }
      }
    }
  }

  window.submitHistorial = async function() {
    var fecha = ge('h-fecha').value;
    var tipo = ge('h-tipo-sel').value;
    var trabajo = ge('h-trabajo').value.trim();
    if (!fecha || !tipo || !trabajo) { toast('Fecha, tipo y trabajo son obligatorios', true); return; }
    var btn = ge('btn-submit-hist');
    btn.disabled = true; btn.textContent = 'Guardando…';
    var r = await fetch('/api/equipos/' + EQ_ID + '/historial', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fecha: fecha, tipo: tipo,
        problema_reportado: ge('h-problema').value.trim() || null,
        descripcion: trabajo,
        tecnico: ge('h-tecnico').value || null,
        coste: ge('h-coste').value ? Number(ge('h-coste').value) : null,
        proxima_revision: ge('h-revision').value || null
      })
    });
    btn.disabled = false; btn.textContent = 'Guardar intervención';
    if (!r.ok) { toast('Error al guardar', true); return; }
    toast('Intervención guardada ✓');
    closeSheet();
    await reload();
  };

  // ---- Fotos ----
  function resetFotos() {
    ge('foto-camara').value = '';
    ge('foto-galeria').value = '';
    ge('file-preview').innerHTML = '';
    ge('btn-upload-foto').disabled = true;
    _selectedFiles = [];
  }

  window.onFotoSelect = function(input) {
    var files = Array.from(input.files);
    if (!files.length) return;
    _selectedFiles = _selectedFiles.concat(files);
    var preview = ge('file-preview');
    preview.innerHTML = '';
    _selectedFiles.forEach(function(f) {
      var img = document.createElement('img');
      var reader = new FileReader();
      reader.onload = function(ev) { img.src = ev.target.result; };
      reader.readAsDataURL(f);
      preview.appendChild(img);
    });
    ge('btn-upload-foto').disabled = _selectedFiles.length === 0;
  };

  window.submitFotos = async function() {
    if (!_selectedFiles.length) return;
    var btn = ge('btn-upload-foto');
    btn.disabled = true; btn.textContent = 'Subiendo…';
    var fd = new FormData();
    _selectedFiles.forEach(function(f) { fd.append('fotos', f); });
    var r = await fetch('/api/equipos/' + EQ_ID + '/fotos', { method: 'POST', credentials: 'include', body: fd });
    btn.disabled = false; btn.textContent = 'Subir fotos';
    if (!r.ok) { toast('Error al subir', true); return; }
    toast('Fotos subidas ✓');
    closeSheet();
    await reload();
  };

  // ---- Componentes ----
  window.openCompById = function(id) { openCompSheet(_compsById[id] || null); };

  window.openCompSheet = function(comp) {
    _editCompId = comp ? comp.id : null;
    ge('comp-sheet-title').textContent = comp ? 'Editar componente' : 'Nuevo componente';
    ge('comp-tipo').value = comp ? (comp.tipo || '') : '';
    ge('comp-desc-inp').value = comp ? (comp.descripcion || '') : '';
    ge('comp-sn-inp').value = comp ? (comp.numero_serie || '') : '';
    ge('btn-comp-guardar').textContent = comp ? 'Guardar cambios' : 'Añadir componente';
    if (currentSheet) closeSheet();
    var sheet = ge('sheet-comp');
    currentSheet = sheet;
    ge('overlay').classList.add('visible');
    requestAnimationFrame(function() { sheet.classList.add('open'); });
  };

  window.submitComp = async function() {
    var tipo = ge('comp-tipo').value.trim();
    if (!tipo) { toast('El tipo es obligatorio', true); return; }
    var btn = ge('btn-comp-guardar');
    btn.disabled = true; btn.textContent = 'Guardando…';
    var body = JSON.stringify({
      tipo: tipo,
      descripcion: ge('comp-desc-inp').value.trim() || null,
      numero_serie: ge('comp-sn-inp').value.trim() || null
    });
    var r;
    if (_editCompId) {
      r = await fetch('/api/componentes/' + _editCompId, {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' }, body: body
      });
    } else {
      r = await fetch('/api/equipos/' + EQ_ID + '/componentes', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' }, body: body
      });
    }
    btn.disabled = false; btn.textContent = _editCompId ? 'Guardar cambios' : 'Añadir componente';
    if (!r.ok) { toast('Error al guardar', true); return; }
    toast(_editCompId ? 'Componente actualizado ✓' : 'Componente añadido ✓');
    closeSheet();
    await reload();
  };

  window.deleteComp = async function(id) {
    if (!confirm('¿Eliminar este componente?')) return;
    var r = await fetch('/api/componentes/' + id, { method: 'DELETE', credentials: 'include' });
    if (!r.ok) { toast('Error al eliminar', true); return; }
    toast('Componente eliminado');
    await reload();
  };

  // ---- Ticket ----
  // ---- Ticket helpers ----
  function tkInitials(nombre) {
    if (!nombre) return '?';
    return nombre.split(' ').map(function(p) { return p[0]; }).join('').slice(0,2).toUpperCase();
  }

  function renderTkTimeline(tk, logs) {
    var events = [];
    events.push({ tipo: 'creacion', cuando: tk.creado_en, quien: tk.asignado_por || '—', txt: 'Ticket creado · ' + esc(tk.estado) });
    (logs || []).forEach(function(l) {
      if (l.campo === 'nota') {
        events.push({ tipo: 'nota', cuando: l.creado_en, quien: l.usuario, txt: l.valor_nuevo });
      } else if (l.campo === 'estado') {
        var col = tkColor(l.valor_nuevo);
        events.push({ tipo: 'estado', cuando: l.creado_en, quien: l.usuario, txt: l.valor_nuevo, col: col });
      } else {
        var LABELS = { tecnico_asignado: 'Técnico', fecha_estimada: 'F. estimada', solucion: 'Solución', coste: 'Coste' };
        var lbl = LABELS[l.campo] || l.campo;
        var ant = l.valor_anterior ? esc(l.valor_anterior) : '<em>vacío</em>';
        var nvo = l.valor_nuevo ? esc(l.valor_nuevo) : '<em>vacío</em>';
        events.push({ tipo: 'cambio', cuando: l.creado_en, quien: l.usuario, txt: lbl + ': ' + ant + ' → ' + nvo });
      }
    });
    return events.map(function(ev) {
      var dot, body;
      if (ev.tipo === 'creacion') {
        dot = '<div class="tkv-ev-dot" style="background:#6366f1">' + tkInitials(ev.quien) + '</div>';
        body = '<div class="tkv-ev-title">' + ev.txt + '</div>';
      } else if (ev.tipo === 'estado') {
        dot = '<div class="tkv-ev-dot" style="background:' + ev.col + '">' + tkInitials(ev.quien) + '</div>';
        body = '<div class="tkv-ev-title">→ <strong style="color:' + ev.col + '">' + esc(ev.txt) + '</strong></div>';
      } else if (ev.tipo === 'nota') {
        dot = '<div class="tkv-ev-dot" style="background:#f59e0b">✎</div>';
        body = '<div class="tkv-ev-note">' + esc(ev.txt) + '</div>';
      } else {
        dot = '<div class="tkv-ev-dot" style="background:#94a3b8;font-size:.6rem">✎</div>';
        body = '<div class="tkv-ev-title">' + ev.txt + '</div>';
      }
      return '<div class="tkv-ev">' + dot +
        '<div class="tkv-ev-body">' + body +
          '<div class="tkv-ev-who">' + esc(ev.quien || '—') + ' · ' + fmtDT(ev.cuando) + '</div>' +
        '</div></div>';
    }).join('');
  }

  function loadTkLog() {
    var tk = state.eq.ticket_activo;
    if (!tk) return;
    var tl = ge('tkv-tl');
    tl.innerHTML = '<div class="tkv-loading">Cargando actividad…</div>';
    fetch('/api/tickets/' + tk.id + '/log', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : []; })
      .then(function(logs) {
        tl.innerHTML = renderTkTimeline(tk, logs);
        var scroll = tl.closest('.sheet-scroll');
        if (scroll) scroll.scrollTop = scroll.scrollHeight;
      })
      .catch(function() { tl.innerHTML = '<div class="tkv-loading">Error al cargar.</div>'; });
  }

  function populateTicketSheet() {
    var tk = state.eq.ticket_activo;
    var wrap = ge('tkv-wrap');
    var create = ge('tkv-create');

    if (tk) {
      ge('tk-sheet-title').textContent = tk.numero;
      wrap.style.display = 'flex';
      create.style.display = 'none';

      // Header
      var col = tkColor(tk.estado);
      ge('tkv-num').textContent = tk.numero;
      var pill = ge('tkv-pill');
      pill.textContent = tk.estado;
      pill.style.cssText = 'background:' + col + '22;color:' + pillTextColor(col) + ';border:1px solid ' + col + '55';

      var metaParts = [];
      if (tk.tecnico_asignado) metaParts.push('👤 ' + esc(tk.tecnico_asignado));
      else metaParts.push('<span style="color:#f59e0b;font-weight:600">Sin asignar</span>');
      if (tk.fecha_estimada) metaParts.push('📅 ' + fmtF(tk.fecha_estimada));
      if (tk.coste != null) metaParts.push('💶 ' + Number(tk.coste).toFixed(2) + ' €');
      if (tk.descripcion) metaParts.push('<div style="margin-top:4px;color:var(--text)">' + esc(tk.descripcion) + '</div>');
      ge('tkv-meta').innerHTML = metaParts.join(' · ');

      // Estado quick-change
      var sel = ge('tkv-estado-sel');
      sel.innerHTML = state.estadosTk.map(function(s) {
        return '<option value="' + esc(s.nombre) + '"' + (s.nombre === tk.estado ? ' selected' : '') + '>' + esc(s.nombre) + '</option>';
      }).join('');

      // Show auth-only bars
      var isAuth = state.authed;
      ge('tkv-nota-bar').style.display = isAuth ? 'flex' : 'none';
      ge('tkv-estado-bar').style.display = isAuth ? 'flex' : 'none';
      ge('tkv-comment-bar').style.display = isAuth ? 'flex' : 'none';
      ge('tkv-footer-btns').style.display = isAuth ? 'flex' : 'none';
      ge('tkv-nota-input').value = '';
      ge('tkv-estado-comentario').value = '';

      loadTkLog();

    } else {
      // No active ticket → show create form
      ge('tk-sheet-title').textContent = 'Crear ticket';
      wrap.style.display = 'none';
      create.style.display = 'block';
      var estadoOpts = state.estadosTk.map(function(s) {
        return '<option value="' + esc(s.nombre) + '">' + esc(s.nombre) + '</option>';
      }).join('');
      var tecOpts = '<option value="">— Sin asignar —</option>' + state.tecnicos.map(function(t) {
        return '<option>' + esc(t) + '</option>';
      }).join('');
      create.innerHTML =
        '<div class="sf"><label>Estado inicial</label><select id="tk-estado">' + estadoOpts + '</select></div>' +
        '<div class="sf"><label>Problema reportado</label><textarea id="tk-desc" placeholder="¿Qué le pasa al equipo?"></textarea></div>' +
        '<div class="sf"><label>Técnico asignado</label><select id="tk-tecnico">' + tecOpts + '</select></div>' +
        '<div class="sf-row">' +
          '<div class="sf"><label>F. entrada</label><input id="tk-entrada" type="date" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
          '<div class="sf"><label>F. estimada</label><input id="tk-estimada" type="date"></div>' +
        '</div>' +
        '<button class="sheet-submit" onclick="submitTicketCreate()">Crear ticket</button>';
    }
  }

  window.submitTkNota = async function() {
    var tk = state.eq.ticket_activo;
    if (!tk) return;
    var input = ge('tkv-nota-input');
    var nota = input.value.trim();
    if (!nota) return;
    input.disabled = true;
    var r = await fetch('/api/tickets/' + tk.id + '/nota', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nota: nota })
    });
    input.disabled = false;
    if (!r.ok) { toast('Error al añadir nota', true); return; }
    input.value = '';
    toast('Nota añadida ✓');
    loadTkLog();
  };

  window.submitTkEstado = async function() {
    var tk = state.eq.ticket_activo;
    if (!tk) return;
    var nuevoEstado = ge('tkv-estado-sel').value;
    var comentario = ge('tkv-estado-comentario').value.trim();
    if (nuevoEstado === tk.estado && !comentario) { toast('Selecciona un estado diferente o añade comentario', true); return; }

    if (nuevoEstado !== tk.estado) {
      var r = await fetch('/api/tickets/' + tk.id, {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado: nuevoEstado, tecnico_asignado: tk.tecnico_asignado, descripcion: tk.descripcion, solucion: tk.solucion, coste: tk.coste, fecha_estimada: tk.fecha_estimada, fecha_entrada: tk.fecha_entrada })
      });
      if (!r.ok) { toast('Error al cambiar estado', true); return; }
      state.eq.ticket_activo.estado = nuevoEstado;
      var col = tkColor(nuevoEstado);
      var pill = ge('tkv-pill');
      pill.textContent = nuevoEstado;
      pill.style.cssText = 'background:' + col + '22;color:' + pillTextColor(col) + ';border:1px solid ' + col + '55';
      renderTicket(state.eq);
    }

    if (comentario) {
      await fetch('/api/tickets/' + tk.id + '/nota', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nota: comentario })
      });
      ge('tkv-estado-comentario').value = '';
    }

    toast('Guardado ✓');
    loadTkLog();
  };

  window.submitTkNotificar = async function() {
    var tk = state.eq.ticket_activo;
    if (!tk) return;
    var r = await fetch('/api/tickets/' + tk.id + '/notificar', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ asignado_por: state.usuario && state.usuario.nombre })
    });
    if (!r.ok) { toast('Error al notificar', true); return; }
    toast('Notificación enviada ✓');
  };

  window.openTkEditSheet = function() {
    var tk = state.eq.ticket_activo;
    if (!tk) return;
    closeSheet();
    var estadoOpts = state.estadosTk.map(function(s) {
      return '<option value="' + esc(s.nombre) + '"' + (tk.estado === s.nombre ? ' selected' : '') + '>' + esc(s.nombre) + '</option>';
    }).join('');
    var tecOpts = '<option value="">— Sin asignar —</option>' + state.tecnicos.map(function(t) {
      return '<option' + (tk.tecnico_asignado === t ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
    ge('tk-edit-body').innerHTML =
      '<div class="sf"><label>Estado</label><select id="tk-edit-estado">' + estadoOpts + '</select></div>' +
      '<div class="sf"><label>Técnico asignado</label><select id="tk-edit-tecnico">' + tecOpts + '</select></div>' +
      '<div class="sf"><label>Solución / trabajo</label><textarea id="tk-edit-solucion" placeholder="Trabajo realizado…">' + esc(tk.solucion || '') + '</textarea></div>' +
      '<div class="sf-row">' +
        '<div class="sf"><label>Coste (€)</label><input id="tk-edit-coste" type="number" step="0.01" value="' + (tk.coste != null ? tk.coste : '') + '" placeholder="0.00"></div>' +
        '<div class="sf"><label>F. estimada</label><input id="tk-edit-estimada" type="date" value="' + (tk.fecha_estimada || '') + '"></div>' +
      '</div>' +
      '<button class="sheet-submit" onclick="submitTicketUpdate()">Guardar cambios</button>';
    var sheet = ge('sheet-ticket-edit');
    currentSheet = sheet;
    ge('overlay').classList.add('visible');
    requestAnimationFrame(function() { sheet.classList.add('open'); });
  };

  window.submitTicketUpdate = async function() {
    var tk = state.eq.ticket_activo;
    var btn = document.querySelector('#tk-edit-body .sheet-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    var r = await fetch('/api/tickets/' + tk.id, {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        estado: ge('tk-edit-estado').value,
        tecnico_asignado: ge('tk-edit-tecnico').value || null,
        solucion: ge('tk-edit-solucion').value.trim() || null,
        coste: ge('tk-edit-coste').value ? Number(ge('tk-edit-coste').value) : null,
        fecha_estimada: ge('tk-edit-estimada').value || null
      })
    });
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar cambios'; }
    if (!r.ok) { toast('Error al guardar', true); return; }
    toast('Ticket actualizado ✓');
    closeSheet();
    await reload();
  };

  window.submitTicketCreate = async function() {
    var btn = ge('tkv-create').querySelector('.sheet-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Creando…'; }
    var desc = ge('tk-desc');
    var r = await fetch('/api/equipos/' + EQ_ID + '/tickets', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        estado: ge('tk-estado').value || 'Pendiente',
        descripcion: (desc && desc.value.trim()) || null,
        tecnico_asignado: ge('tk-tecnico').value || null,
        fecha_entrada: ge('tk-entrada').value || null,
        fecha_estimada: ge('tk-estimada').value || null
      })
    });
    if (btn) { btn.disabled = false; btn.textContent = 'Crear ticket'; }
    if (!r.ok) { toast('Error al crear', true); return; }
    toast('Ticket creado ✓');
    closeSheet();
    await reload();
  };

  // ---- Photo viewer ----
  window.openPhoto = function(src) {
    ge('pv-img').src = src;
    ge('photo-viewer').classList.add('visible');
  };
  window.closePhoto = function() { ge('photo-viewer').classList.remove('visible'); };

  // ---- Init ----
  load();
})();
</script>
</body>
</html>
